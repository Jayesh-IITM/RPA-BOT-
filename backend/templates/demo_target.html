<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GovBridge Citizens Portal - Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body {
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .login-container {
      width: 100%;
      max-width: 440px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 2.25rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }
    .header-badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      color: #10b981;
      background: rgba(16, 185, 129, 0.1);
      border: 1px dashed #10b981;
      padding: 3px 10px;
      border-radius: 6px;
      margin-bottom: 0.75rem;
    }
    h1 { font-size: 1.45rem; font-weight: 700; color: #fff; margin-bottom: 0.25rem; }
    p { font-size: 0.85rem; color: #94a3b8; margin-bottom: 1.5rem; }
    .form-group { margin-bottom: 1.25rem; }
    label { display: block; font-size: 0.85rem; font-weight: 600; color: #cbd5e1; margin-bottom: 0.4rem; }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 0.75rem 1rem;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 8px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s;
    }
    input[type="text"]:focus, input[type="password"]:focus {
      border-color: #0ea5e9;
      box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.25);
    }
    .alert-error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #fca5a5;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 1.25rem;
    }
    .btn-submit {
      width: 100%;
      padding: 0.85rem;
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 0.5rem;
    }
    .btn-submit:hover {
      background: linear-gradient(135deg, #0369a1, #0284c7);
      transform: translateY(-1px);
    }
    .demo-creds {
      margin-top: 1.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid #334155;
      font-size: 0.8rem;
      color: #94a3b8;
    }
    .demo-creds code {
      background: #0f172a;
      padding: 2px 6px;
      border-radius: 4px;
      color: #38bdf8;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="header-badge">MAHASETU - RPA PORTAL</div>
    <h1>Official Citizen Sign In</h1>
    <p>Sign in with your Citizen ID to access public services</p>

    {% if error %}
    <div id="error-message" class="alert-error">
      {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/demo-target">
      <div class="form-group">
        <label for="username">Citizen ID or Email</label>
        <input type="text" id="username" name="username" placeholder="Enter Username or Email" required autofocus />
      </div>

      <div class="form-group">
        <label for="password">Security Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required />
      </div>

      <div class="form-group" style="display: flex; align-items: center; gap: 0.5rem;">
        <input type="checkbox" id="remember-me" name="remember" style="width: 15px; height: 15px;" />
        <label for="remember-me" style="margin-bottom: 0; font-size: 0.8rem; cursor: pointer; color: #94a3b8;">
          Remember this session on this computer
        </label>
      </div>

      <button type="submit" id="submit-btn" class="btn-submit">
        Sign In to Portal
      </button>
    </form>

    <div class="demo-creds">
      <div><strong>Demo Test Credentials:</strong></div>
      <div style="margin-top: 4px;">User: <code>gov_citizen</code> &nbsp;|&nbsp; Pass: <code>GovPass@2026</code></div>
    </div>
  </div>

</body>
</html>
