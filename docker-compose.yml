version: '3.8'

services:
  mahasetu-rpa:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mahasetu-rpa-app
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - PORT=5000
      - HOST=0.0.0.0
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-mahasetu-production-secret-token-2026}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - PLAYWRIGHT_HEADLESS_DEFAULT=true
    volumes:
      # Persistent storage for saved bots, recordings, and screenshots
      - ./backend/data:/app/backend/data
      - ./dist:/app/dist
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
